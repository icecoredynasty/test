<div class="team-grid">

  {% assign teams = site.teams | sort: "title" %}

  {% for team in teams %}

    <a
      href="{{ team.url | relative_url }}"
      class="team-card"
      data-league="{{ team.league | default: 1 }}"
      data-conference="{{ team.conference | downcase }}"
    >

      <div class="team-card__logo">

        <img
          src="{{ team.logo | relative_url }}"
          alt="{{ team.title }}"
          loading="lazy"
        >

      </div>

      <div class="team-card__name">
        {{ team.title }}
      </div>

    </a>

  {% endfor %}

</div>
